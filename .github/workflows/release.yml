name: Release zip

# Tag push v*.*.* -> build module_<repo>-<X.Y.Z>.zip from the tag and attach it
# to the GitHub Release (created if missing). Manual run -> zip as build artifact.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -ohP "this->version\s*=\s*'\K[^']+" core/modules/mod*.class.php | head -1)
          fi
          echo "zipname=module_${MODULE}-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          DESC=$(grep -ohP "this->version\s*=\s*'\K[^']+" core/modules/mod*.class.php | head -1)
          if [[ "${DESC}" != "${VERSION}" ]]; then
            echo "::error::Tag is v${VERSION} but descriptor says ${DESC}"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l -d display_errors=1

      - name: Build zip
        # git archive keeps only tracked files (no deployed models, no local zips)
        # under a single top-level dir named after the module, as Dolibarr expects.
        run: |
          git archive --format=zip --prefix="${MODULE}/" -o "${{ steps.ver.outputs.zipname }}" HEAD
          unzip -p "${{ steps.ver.outputs.zipname }}" "${MODULE}/core/modules/mod"*.class.php > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zipname }}
          path: ${{ steps.ver.outputs.zipname }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.zipname }}
          fail_on_unmatched_files: true
